name: Sync IIS classes to iCal feed

on:
  schedule:
    # Every 30 minutes during working hours, hourly otherwise.
    # GitHub cron has jitter, so treat these as approximate.
    - cron: "*/30 14-23 * * 1-5"
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ical-sync
  cancel-in-progress: false

jobs:
  build-ics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate .ics file
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          # Board and column IDs are defined in SOURCES inside the script.
          TARGET_INSTRUCTOR: "Jason Smith"
          EXCLUDE_STATUSES: "Cancelled,Pending Reschedule"
          DEFAULT_TZ: "America/Los_Angeles"
          OUTPUT_FILE: "jason_classes.ics"
        run: python generate_ics.py

      - name: Commit updated .ics file
        run: |
          git config user.name "trainings-ical-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jason_classes.ics
          if git diff --quiet --cached; then
            echo "No calendar changes."
          else
            git commit -m "Update calendar feed [skip ci]"
            git push
          fi
