<title>IIS Trainings Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a calendar app. Calendar on the left; on wide / unfolded screens the selected day sits in a second pane on the right.
   Four skins on <html data-skin>: native + studio (light), midnight + graphite (dark). "Auto" picks native or graphite from the phone. */
:root {
  --bg: #ffffff; --bg-img: none; --surface: #ffffff; --surface-2: #f1f5f9; --fg: #0f172a; --muted: #64748b; --line: #eef2f7;
  --accent: #2563eb; --accent-soft: #eff6ff; --accent-fg: #ffffff; --today-bg: #ef4444; --today-fg: #ffffff;
  --weekend: #fafbfc; --sel: rgba(37, 99, 235, .07); --shadow: 0 6px 24px rgba(15, 23, 42, .08); --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --glass: none;
  color-scheme: light;
}
:root[data-skin="studio"] {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f6f7fb; --fg: #1e2235; --muted: #6b7290; --line: #e6e9f1;
  --accent: #4f46e5; --accent-soft: #eef0ff; --today-bg: #4f46e5; --weekend: #f8f9fc; --sel: rgba(79, 70, 229, .07);
  --shadow: 0 1px 2px rgba(30, 34, 53, .06), 0 10px 30px rgba(30, 34, 53, .08); --radius: 20px;
  --font: "Plus Jakarta Sans", system-ui, sans-serif; --font-display: "Plus Jakarta Sans", system-ui, sans-serif;
}
:root[data-skin="midnight"] {
  --bg: #0a0d1c; --bg-img: radial-gradient(120% 60% at 0% 0%, #26306b 0%, transparent 55%), radial-gradient(90% 50% at 100% 15%, #3b1f5e 0%, transparent 60%);
  --surface: rgba(255, 255, 255, .06); --surface-2: rgba(255, 255, 255, .07); --fg: #e8ebff; --muted: #9aa3cc; --line: rgba(255, 255, 255, .07);
  --accent: #9aa8ff; --accent-soft: rgba(139, 156, 255, .14); --today-bg: linear-gradient(135deg, #6d7cff, #b06bff); --today-fg: #fff;
  --weekend: rgba(0, 0, 0, .14); --sel: rgba(139, 156, 255, .12); --shadow: inset 0 1px 0 rgba(255, 255, 255, .08); --radius: 20px;
  --font: "Manrope", system-ui, sans-serif; --font-display: "Manrope", system-ui, sans-serif; --glass: blur(14px);
  color-scheme: dark;
}
:root[data-skin="graphite"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --fg: #f5f5f7; --muted: #8e8e93; --line: #232326;
  --accent: #0a84ff; --accent-soft: rgba(10, 132, 255, .16); --today-bg: #ff453a; --today-fg: #fff;
  --weekend: #0b0b0c; --sel: rgba(10, 132, 255, .14); --shadow: none; --radius: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background-color: var(--bg); background-image: var(--bg-img); background-attachment: fixed; color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; transition: background-color .3s, color .3s; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; min-height: 100%; }
.cal { flex: 1 1 auto; min-width: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 12px 60px; }
.hinge, .pane { display: none; }
@media (min-width: 700px) {
  .cal { flex-basis: 57%; max-width: 57%; padding-right: 10px; }
  .hinge { display: block; width: 1px; flex: none; background: var(--line); margin-block: 16px; }
  .pane { display: block; flex: 1 1 0; min-width: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; }
}

/* Header */
header { display: grid; gap: 12px; padding: 4px 4px 12px; }
.top { display: flex; align-items: flex-start; gap: 8px; }
.titles { flex: 1; min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 7.5vw, 36px); line-height: 1.05; letter-spacing: -.025em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h1 em { font-style: normal; color: var(--muted); font-weight: 600; }
:root[data-skin="studio"] h1 em { color: var(--accent); }
:root[data-skin="midnight"] h1 em { background: linear-gradient(90deg, #8b9cff, #e08bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: var(--muted); font-size: 14px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; color: var(--accent); flex: none; transition: background .2s, transform .15s; }
.icon:hover { background: var(--surface-2); }
:root[data-skin="midnight"] .icon, :root[data-skin="studio"] .icon { background: var(--surface); box-shadow: var(--shadow); color: var(--fg); }
:root[data-skin="midnight"] .icon { border: 1px solid rgba(255,255,255,.12); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); }
:root[data-skin="studio"] .icon { border-radius: 12px; }
.icon svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon.on { color: var(--accent-fg); background: var(--accent) !important; }
.icon.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.controls { display: flex; align-items: center; gap: 6px; }
.seg { display: flex; padding: 3px; border-radius: 10px; background: var(--surface-2); position: relative; }
.seg button { position: relative; z-index: 1; padding: 6px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--fg); }
.seg .pill { position: absolute; top: 3px; bottom: 3px; border-radius: 8px; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.14); transition: left .3s cubic-bezier(.3,1.3,.5,1), width .3s cubic-bezier(.3,1.3,.5,1); }
:root[data-skin="studio"] .seg { background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; }
:root[data-skin="studio"] .seg .pill { background: var(--fg); border-radius: 9px; }
:root[data-skin="studio"] .seg button[aria-pressed="true"] { color: #fff; }
:root[data-skin="midnight"] .seg { border-radius: 99px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.06); }
:root[data-skin="midnight"] .seg button, :root[data-skin="midnight"] .seg .pill { border-radius: 99px; }
:root[data-skin="midnight"] .seg .pill { background: linear-gradient(90deg, #6d7cff, #b06bff); box-shadow: 0 4px 16px rgba(125,110,255,.45); }
:root[data-skin="midnight"] .seg button[aria-pressed="true"] { color: #fff; }
:root[data-skin="graphite"] .seg .pill { background: #636366; }
.spacer { flex: 1; }
.btn { padding: 7px 13px; font-size: 14px; font-weight: 600; color: var(--accent); border-radius: 10px; }
.btn:hover { background: var(--accent-soft); }
:root[data-skin="studio"] .btn { background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; }
:root[data-skin="midnight"] .btn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 99px; color: var(--fg); }
.btn:active, .icon:active { transform: scale(.94); }

.banner { margin: 0 4px 12px; padding: 12px 14px; border-radius: 12px; display: flex; gap: 10px; align-items: center; font-size: 14px; flex-wrap: wrap; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); }
.banner.warn { border-left: 4px solid #f43f5e; }
.banner.info { border-left: 4px solid var(--accent); }
.banner p { margin: 0; flex: 1 1 200px; }

/* Month grid */
.board { position: relative; touch-action: pan-y; }
:root[data-skin="studio"] .board { background: var(--surface); border-radius: 20px; padding: 10px 8px 8px; box-shadow: var(--shadow); }
.page-in-next { animation: inNext .35s cubic-bezier(.2,.9,.3,1); }
.page-in-prev { animation: inPrev .35s cubic-bezier(.2,.9,.3,1); }
@keyframes inNext { from { transform: translateX(32px); opacity: 0; } }
@keyframes inPrev { from { transform: translateX(-32px); opacity: 0; } }
.dow { display: grid; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.week { position: relative; }
.cells { display: grid; height: 100%; }
.cell { border-bottom: 1px solid var(--line); padding: 4px 5px; display: flex; align-items: flex-start; justify-content: space-between; gap: 2px; text-align: left; position: relative; min-width: 0; transition: background .2s; }
.cell + .cell { border-left: 1px solid var(--line); }
:root[data-skin="studio"] .cell + .cell, :root[data-skin="midnight"] .cell + .cell { border-left: 0; }
.cell.wkend { background: var(--weekend); }
.cell.out .num { opacity: .32; }
.cell.sel { background: var(--sel); }
.num { font-size: 14px; font-weight: 500; min-width: 25px; height: 25px; padding: 0 4px; display: grid; place-items: center; border-radius: 99px; font-variant-numeric: tabular-nums; }
.today .num { background: var(--today-bg); color: var(--today-fg); font-weight: 700; }
:root[data-skin="studio"] .today .num { border-radius: 8px; }
:root[data-skin="midnight"] .today .num { box-shadow: 0 0 14px rgba(140,120,255,.7); }
.count { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }

.bar { position: absolute; height: 21px; display: flex; align-items: center; gap: 4px; padding: 0 6px; font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; overflow: hidden; text-align: left; transform-origin: left center; animation: grow .45s cubic-bezier(.2,.9,.3,1) both; }
.bar .ini { font-size: 9.5px; font-weight: 800; padding: 2px 4px; border-radius: 4px; flex: none; letter-spacing: .02em; }
.bar .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar.dash { outline: 1.5px dashed currentColor; outline-offset: -1.5px; opacity: .85; }
.bar.x { opacity: .5; text-decoration: line-through; }
@keyframes grow { from { transform: scaleX(.04); opacity: 0; } }
/* native */
.bar { border-radius: 5px; background: color-mix(in srgb, var(--c) 14%, #fff); color: color-mix(in srgb, var(--c) 72%, #000); box-shadow: inset 3px 0 0 var(--c); }
.bar .ini { background: color-mix(in srgb, var(--c) 24%, #fff); }
.bar.cb { box-shadow: none; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.bar.ca { border-top-right-radius: 0; border-bottom-right-radius: 0; }
/* studio */
:root[data-skin="studio"] .bar { border-radius: 99px; background: color-mix(in srgb, var(--c) 28%, #fff); color: color-mix(in srgb, var(--c) 55%, #10121c); box-shadow: none; }
:root[data-skin="studio"] .bar .ini { background: #fff; border-radius: 99px; }
:root[data-skin="studio"] .bar.cb { border-radius: 0 99px 99px 0; }
:root[data-skin="studio"] .bar.ca { border-radius: 99px 0 0 99px; }
:root[data-skin="studio"] .bar.cb.ca { border-radius: 0; }
/* midnight */
:root[data-skin="midnight"] .bar { border-radius: 7px; background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 60%, #0a0d1c)); color: #fff; box-shadow: 0 2px 10px color-mix(in srgb, var(--c) 40%, transparent); }
:root[data-skin="midnight"] .bar .ini { background: rgba(0,0,0,.25); }
/* graphite */
:root[data-skin="graphite"] .bar { background: color-mix(in srgb, var(--c) 30%, #1c1c1e); color: color-mix(in srgb, var(--c) 40%, #fff); box-shadow: inset 3px 0 0 var(--c); }
:root[data-skin="graphite"] .bar .ini { background: color-mix(in srgb, var(--c) 45%, #1c1c1e); }
:root[data-skin="graphite"] .bar.cb { box-shadow: none; }

/* Week list */
.days { display: grid; gap: 20px; margin-top: 18px; }
.days.cols { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.dayhead { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 4px 6px 8px; text-align: left; border-radius: 10px; }
.dayhead .dn { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.dayhead.today .dn { color: var(--accent); }
.dayhead .dd { color: var(--muted); font-size: 14px; flex: 1; }
.none { color: var(--muted); padding-left: 6px; font-size: 14px; opacity: .7; }
.stack { display: grid; gap: 10px; }

/* Cards */
.card { position: relative; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); cursor: pointer; transition: transform .15s, box-shadow .3s; backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); overflow: hidden; }
:root[data-skin="midnight"] .card { border-color: rgba(255,255,255,.12); }
:root[data-skin="studio"] .card { border: 0; }
:root[data-skin="studio"] .card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--c); }
.card:active { transform: scale(.99); }
.card.x { opacity: .6; }
.chead { display: flex; gap: 12px; align-items: flex-start; }
.stripe { width: 4px; align-self: stretch; border-radius: 4px; background: var(--c); flex: none; }
:root[data-skin="studio"] .stripe { display: none; }
:root[data-skin="midnight"] .stripe { box-shadow: 0 0 8px var(--c); }
.cbody { flex: 1; min-width: 0; display: grid; gap: 3px; }
.ctitle { font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
.card.x .ctitle { text-decoration: line-through; }
.cseg { color: var(--accent); font-size: 14px; font-weight: 600; }
.cwho { font-size: 14px; display: flex; align-items: center; gap: 6px; color: var(--fg); }
.cwho::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.cmeta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.cside { display: grid; gap: 10px; justify-items: end; flex: none; }
.pill2 { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; color: color-mix(in srgb, var(--sc) 70%, var(--fg)); background: color-mix(in srgb, var(--sc) 16%, transparent); }
:root[data-skin="midnight"] .pill2 { border-radius: 99px; border: 1px solid color-mix(in srgb, var(--sc) 45%, transparent); color: color-mix(in srgb, var(--sc) 50%, #fff); }
.chev { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2.4; transition: transform .3s; }
.card.open .chev { transform: rotate(180deg); }
.more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s cubic-bezier(.2,.9,.3,1); }
.card.open .more { grid-template-rows: 1fr; }
.more > div { overflow: hidden; min-height: 0; }
.details { display: grid; gap: 12px; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--line); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 16px; }
:root[data-skin="studio"] .grid2 { background: var(--surface-2); border-radius: 14px; padding: 12px; }
.row { display: grid; gap: 1px; min-width: 0; }
.lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.val { font-size: 15px; overflow-wrap: anywhere; user-select: text; }
.val2 { font-size: 12px; color: var(--accent); font-weight: 600; }
.prog { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--muted); flex-wrap: wrap; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.dots i { width: 18px; height: 5px; border-radius: 3px; background: var(--surface-2); animation: pop .35s both; }
.dots i.done { background: color-mix(in srgb, var(--c) 55%, transparent); }
.dots i.now { background: var(--accent); }
:root[data-skin="midnight"] .dots i.now { background: linear-gradient(90deg, #6d7cff, #b06bff); }
@keyframes pop { from { transform: scaleX(.2); opacity: 0; } }
.track { flex: 1 1 120px; height: 5px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.track span { display: block; height: 100%; background: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions a { text-decoration: none; padding: 8px 13px; border-radius: 10px; font-size: 13px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.actions a.p { background: var(--accent); color: var(--accent-fg); }
:root[data-skin="studio"] .actions a.p { background: var(--fg); color: #fff; }
:root[data-skin="midnight"] .actions a { border-radius: 99px; }
:root[data-skin="midnight"] .actions a.p { background: linear-gradient(90deg, #6d7cff, #b06bff); color: #fff; }

/* Selected day */
.zoom { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background-color: var(--bg); background-image: var(--bg-img); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); transform-origin: var(--ox, 50%) var(--oy, 50%); transition: transform .4s cubic-bezier(.2,.9,.25,1), opacity .25s; touch-action: pan-y; }
.zoom.closed { transform: scale(.1); opacity: 0; pointer-events: none; }
.zoom[hidden] { display: none !important; }
.dayview { display: grid; gap: 16px; max-width: 760px; margin: 0 auto; }
.dvtop { display: flex; align-items: center; gap: 6px; }
.dvtop .t { flex: 1; min-width: 0; }
.dvname { font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -.025em; }
.dvname.today { color: var(--accent); }
.dvdate { color: var(--muted); font-size: 15px; margin-top: 2px; }
.dvcount { font-size: 14px; font-weight: 600; color: var(--muted); }
.ruler { padding: 12px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
:root[data-skin="studio"] .ruler { border: 0; }
.ruler .lbl { margin-bottom: 6px; }
.ruler svg { width: 100%; display: block; overflow: visible; }
.ruler text { fill: var(--muted); font-family: var(--font); }
.ruler line { stroke: var(--line); }
.empty { text-align: center; padding: 56px 0; color: var(--muted); font-size: 17px; font-weight: 600; }
.empty svg { width: 40px; height: 40px; stroke: currentColor; fill: none; stroke-width: 1.5; display: block; margin: 0 auto 10px; opacity: .6; }

/* Options sheet */
.sheet { position: fixed; inset: auto 0 0 0; z-index: 30; max-height: 84vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(18px, env(safe-area-inset-left, 0px)); transition: transform .35s cubic-bezier(.2,.9,.3,1); box-shadow: 0 -20px 60px rgba(0,0,0,.25); }
:root[data-skin="midnight"] .sheet { background: #141833; }
:root[data-skin="graphite"] .sheet { background: #1c1c1e; }
@media (min-width: 700px) { .sheet { left: auto; right: 16px; bottom: 16px; width: 400px; border-radius: 20px; } }
.sheet::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet.closed { transform: translateY(110%); }
.scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.35); transition: opacity .3s; }
.scrim.closed { opacity: 0; pointer-events: none; }
.sheet h2 { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 10px; display: flex; align-items: center; }
.sheet h2 span { flex: 1; }
.sheet h3 { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
.field { width: 100%; padding: 10px 12px; font: inherit; font-size: 16px; color: var(--fg); background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; }
.field:focus { outline: none; border-color: var(--accent); }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
.themes button { display: grid; gap: 6px; justify-items: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 0; border-radius: 12px; }
.themes button[aria-pressed="true"] { color: var(--accent); }
.sw { width: 100%; aspect-ratio: 1 / 1.15; max-width: 76px; border-radius: 12px; border: 2px solid var(--line); padding: 7px 6px; display: grid; align-content: start; gap: 4px; overflow: hidden; }
.themes button[aria-pressed="true"] .sw { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.sw i { display: block; height: 6px; border-radius: 3px; }
.sw b { display: block; width: 12px; height: 12px; border-radius: 50%; margin-bottom: 3px; }
.who { display: grid; gap: 1px; }
.who button { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 10px; text-align: left; font-size: 15px; }
.who button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.who .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.who .n { flex: 1; }
.who .k { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

<script>
(() => {
"use strict";
// ---------- monday boards behind the Calendar dashboard ----------
const SERVER = "monday.com";
const TOOL = "all_api_read";
const BOARDS = [
  { key: "trainings", id: "18402638125", title: "Trainings", subitems: false },
  { key: "bootcamps", id: "18407475639", title: "Bootcamps / Multi-Instructor", subitems: true },
  { key: "completed", id: "18408627394", title: "Completed Courses", subitems: false },
];
const COL = {
  instructor: "color_mm15thk1", status: "color_mm1bshmb", timeline: "timerange_mm1cf8pp",
  startTime: "hour_mm15ypeg", endTime: "hour_mm15xbd2", timezone: "dropdown_mm158c1g",
  opportunity: "text_mm2125xz", delivery: "color_mm21f51p", location: "location_mm2nbxj9",

  contact: "board_relation_mm21g5yf", confirmed: "boolean_mm2dm4ap",
};
const SUB = { instructor: "color_mm25xv4v", timeline: "timerange_mm2517h7", status: "status" };
const FIELDS = `id text value ... on StatusValue { label label_style { color } } ... on BoardRelationValue { display_value } ... on MirrorValue { display_value }`;
const ITEM = (sub) => `id name group { title } column_values { ${FIELDS} }` + (sub ? ` subitems { id name column_values { ${FIELDS} } }` : "");
const Q_FIRST = (sub) => `query ($b: ID!) { boards(ids: [$b]) { items_page(limit: ${sub ? 40 : 100}) { cursor items { ${ITEM(sub)} } } } }`;
const Q_NEXT = (sub) => `query ($c: String!) { next_items_page(limit: ${sub ? 40 : 100}, cursor: $c) { cursor items { ${ITEM(sub)} } } }`;

const TZ = {
  "est":"America/New_York","edt":"America/New_York","us eastern":"America/New_York",
  "cst":"America/Chicago","cdt":"America/Chicago","us central":"America/Chicago",
  "mst":"America/Denver","mdt":"America/Denver","us mountain":"America/Denver",
  "pst":"America/Los_Angeles","pdt":"America/Los_Angeles","us pacific":"America/Los_Angeles",
  "utc":"UTC","london":"Europe/London","europe western":"Europe/London",
  "paris":"Europe/Paris","cet":"Europe/Paris","europe central":"Europe/Paris","europe eastern":"Europe/Bucharest",
  "india":"Asia/Kolkata","ist":"Asia/Kolkata","singapore":"Asia/Singapore","asia pacific":"Asia/Singapore",
};
const NON_PERSON = new Set(["","unassigned","requested dates","tentative","holiday","cancelled","pending reschedule","multiple instructors","multiple instructros","bootcamp/mulit-instructor","bootcamp/multi-instructor"]);
const PALETTE = ["#2563eb","#7c3aed","#0d9488","#d97706","#db2777","#0891b2"];
const SKINS = [
  { id: "auto", name: "Auto", bg: "linear-gradient(135deg,#ffffff 50%,#000000 50%)", acc: "#2563eb", bars: ["#2563eb", "#ff453a"] },
  { id: "native", name: "Native", bg: "#ffffff", acc: "#ef4444", bars: ["#dbe7fd", "#ece3fd"] },
  { id: "studio", name: "Studio", bg: "#eef1f6", acc: "#4f46e5", bars: ["#c7c9fb", "#bfeee6"] },
  { id: "midnight", name: "Midnight", bg: "radial-gradient(120% 80% at 0% 0%,#26306b,#0a0d1c 70%)", acc: "linear-gradient(135deg,#6d7cff,#b06bff)", bars: ["#5b6cff", "#a855f7"] },
  { id: "graphite", name: "Graphite", bg: "#000000", acc: "#ff453a", bars: ["#1f3a5c", "#3b2a52"] },
];

// ---------- small helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const store = {
  get(k, d) { try { const v = localStorage.getItem("iis:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("iis:" + k, JSON.stringify(v)); } catch {} },
};
function seed(str) { let h = 2166136261; for (const ch of String(str)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(s) { let x = s || 1; return () => { x = Math.imul(x ^ (x >>> 15), 2246822507) ^ Math.imul(x ^ (x >>> 13), 3266489909); x ^= x >>> 16; return (x >>> 0) / 4294967296; }; }
function chalkColor(hex, fallback) {
  if (/^#?[0-9a-f]{6}$/i.test(hex || "")) return "#" + hex.replace("#", "");
  return PALETTE[seed(fallback) % PALETTE.length];
}

// Days are "YYYY-MM-DD" strings; math runs in UTC so DST never shifts them.
const D = {
  ms(k) { const [y, m, d] = k.split("-").map(Number); return Date.UTC(y, m - 1, d); },
  key(ms) { return new Date(ms).toISOString().slice(0, 10); },
  add(k, n) { return D.key(D.ms(k) + n * 864e5); },
  addMonths(k, n) { const d = new Date(D.ms(k)); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); return D.key(d.getTime()); },
  wd(k) { return new Date(D.ms(k)).getUTCDay(); },
  wkend(k) { const w = D.wd(k); return w === 0 || w === 6; },
  today() { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; },
  fmt(k, o) { return new Date(D.ms(k)).toLocaleDateString(undefined, { timeZone: "UTC", ...o }); },
  between(a, b) { return Math.round((D.ms(b) - D.ms(a)) / 864e5); },
  weekStart(k) { return D.add(k, -D.wd(k)); },
  week(k) { const s = D.weekStart(k); return [0,1,2,3,4,5,6].map((i) => D.add(s, i)); },
  monthWeeks(k) {
    const first = k.slice(0, 8) + "01", last = D.add(D.addMonths(first, 1), -1);
    const out = []; let c = D.weekStart(first);
    while (c <= last) { out.push([0,1,2,3,4,5,6].map((i) => D.add(c, i))); c = D.add(c, 7); }
    return out;
  },
};
const clock = (t) => { if (!t) return ""; const h = t.h % 12 || 12; return t.m ? `${h}:${pad(t.m)} ${t.h < 12 ? "AM" : "PM"}` : `${h} ${t.h < 12 ? "AM" : "PM"}`; };
function tzOffsetMs(instant, tz) {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }).formatToParts(new Date(instant));
  const g = (t) => Number(parts.find((p) => p.type === t).value);
  return Date.UTC(g("year"), g("month") - 1, g("day"), g("hour") % 24, g("minute"), g("second")) - instant;
}
function instantAt(day, t, tz) {
  const [y, m, d] = day.split("-").map(Number);
  const guess = Date.UTC(y, m - 1, d, t.h, t.m);
  if (!tz) return new Date(y, m - 1, d, t.h, t.m).getTime();
  let at = guess - tzOffsetMs(guess, tz);
  at = guess - tzOffsetMs(at, tz);
  return at;
}

// ---------- training model ----------
function occurs(t, k) { return k >= t.start && k <= t.end && (!D.wkend(k) || t.wkOnly); }
function sessions(t) { const out = []; let d = t.start; while (d <= t.end && out.length < 400) { if (occurs(t, d)) out.push(d); d = D.add(d, 1); } return out; }
function interval(t, day) {
  if (!t.st || !t.et) return null;
  const a = instantAt(day, t.st, t.tzId); let b = instantAt(day, t.et, t.tzId);
  if (b <= a) b = a + 36e5;
  return [a, b];
}
const course = (t) => t.name.split("|").map((s) => s.trim()).filter(Boolean)[0] || t.name;
const rest = (t) => t.name.split("|").map((s) => s.trim()).filter(Boolean).slice(1).join(" · ");
const title = (t) => t.segment ? `${course(t)} · ${t.segment}` : course(t);
const isX = (t) => /cancel|reschedul/i.test(t.status);
const realPerson = (t) => !NON_PERSON.has(t.instructor.toLowerCase());
const initials = (t) => realPerson(t) ? t.instructor.split(/\s+/).slice(0, 2).map((w) => w[0] || "").join("").toUpperCase() : "?";
const tColor = (t) => chalkColor(t.iHex, t.instructor);

function bag(values) {
  const m = {}; for (const v of values || []) m[v.id] = v;
  const json = (id) => { try { return m[id]?.value ? JSON.parse(m[id].value) : null; } catch { return null; } };
  return {
    text: (id) => (m[id]?.text || "").trim(),
    label: (id) => (m[id]?.label ?? m[id]?.text ?? "").trim(),
    color: (id) => m[id]?.label_style?.color || null,
    display: (id) => (m[id]?.display_value ?? m[id]?.text ?? "").trim(),
    range: (id) => { const j = json(id); if (!j?.from) return null; const a = j.from.slice(0, 10), b = (j.to || j.from).slice(0, 10); return a <= b ? [a, b] : [b, a]; },
    hour: (id) => { const j = json(id); return j && j.hour != null ? { h: Number(j.hour), m: Number(j.minute || 0) } : null; },
    checked: (id) => { const j = json(id); return j?.checked === true || j?.checked === "true"; },
  };
}
function toTrainings(item, board) {
  const c = bag(item.column_values);
  const tzLabel = c.text(COL.timezone);
  const base = {
    id: item.id, itemID: item.id, board: board.key, boardTitle: board.title, group: item.group?.title || "",
    name: item.name, segment: null,
    instructor: c.label(COL.instructor), iHex: c.color(COL.instructor),
    status: c.label(COL.status), sHex: c.color(COL.status),
    st: c.hour(COL.startTime), et: c.hour(COL.endTime),
    tz: tzLabel, tzId: TZ[(tzLabel.split(",")[0] || "").trim().toLowerCase()] || null,
    delivery: c.label(COL.delivery), location: c.text(COL.location), opp: c.text(COL.opportunity),
    customer: c.display(COL.customer), client: c.display(COL.client), contact: c.display(COL.contact),
    confirmed: c.checked(COL.confirmed),
  };
  const finish = (t, r) => { t.start = r[0]; t.end = r[1]; t.wkOnly = D.between(r[0], r[1]) < 2 && D.wkend(r[0]) && D.wkend(r[1]); return t; };
  const segs = [];
  for (const s of item.subitems || []) {
    const sc = bag(s.column_values); const r = sc.range(SUB.timeline); if (!r) continue;
    const parts = s.name.split("|").map((x) => x.trim());
    const wk = parts.find((p) => /^week/i.test(p)); const who = parts.find((p) => p && !/^week/i.test(p));
    const lab = sc.label(SUB.instructor); const st = sc.label(SUB.status);
    const t = { ...base, id: "sub-" + s.id, segment: wk || s.name, instructor: lab || who || "Unassigned", iHex: lab ? sc.color(SUB.instructor) : null };
    if (st && !isX(base)) { t.status = st; t.sHex = sc.color(SUB.status); }
    segs.push(finish(t, r));
  }
  if (segs.length) return segs;
  const r = c.range(COL.timeline);
  return r ? [finish(base, r)] : [];
}

// ---------- state ----------
const S = {
  all: store.get("cache", []),
  syncedAt: store.get("syncedAt", null),
  mode: store.get("mode", "month"),
  anchor: D.today(),
  sel: D.today(),
  focus: null,
  open: new Set(),
  who: store.get("who", ""),
  myName: store.get("myName", "Jason Smith"),
  hideX: store.get("hideX", true),
  incDone: store.get("incDone", true),
  wkends: store.get("wkends", false),
  search: "",
  loading: false,
  error: null,
  dir: 0,
  skin: store.get("skin", "auto"),
};
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function applySkin() {
  const id = S.skin === "auto" ? (darkMQ.matches ? "graphite" : "native") : S.skin;
  document.documentElement.dataset.skin = id;
}
darkMQ.addEventListener?.("change", () => { if (S.skin === "auto") applySkin(); });
applySkin();
const wide = () => matchMedia("(min-width: 700px)").matches;
function visible() {
  const q = S.search.trim().toLowerCase();
  const who = S.who === "__me__" ? S.myName : S.who;
  return S.all.filter((t) => {
    if (S.hideX && isX(t)) return false;
    if (!S.incDone && t.board === "completed") return false;
    if (who && t.instructor.toLowerCase() !== who.toLowerCase()) return false;
    if (q && ![t.name, t.segment, t.instructor, t.customer, t.client, t.opp, t.location].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
}
const onDay = (list, k) => list.filter((t) => occurs(t, k)).sort((a, b) => ((interval(a, k)?.[0] ?? 0) - (interval(b, k)?.[0] ?? 0)) || title(a).localeCompare(title(b)));
const cols = (days) => S.wkends ? days : days.filter((d) => !D.wkend(d));

function layout(days, list) {
  const first = days[0], last = days[days.length - 1], runs = [];
  for (const t of list) {
    if (t.end < first || t.start > last) continue;
    for (let c = 0; c < days.length; c++) {
      if (!occurs(t, days[c])) continue;
      const s = c; while (c + 1 < days.length && occurs(t, days[c + 1])) c++;
      runs.push({ t, s, e: c });
    }
  }
  runs.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s) || (a.t.start < b.t.start ? -1 : a.t.start > b.t.start ? 1 : 0) || title(a.t).localeCompare(title(b.t)));
  const ends = [], bars = [];
  for (const r of runs) {
    let lane = ends.findIndex((e) => e < r.s);
    if (lane < 0) { lane = ends.length; ends.push(r.e); } else ends[lane] = r.e;
    bars.push({ ...r, lane, cb: r.t.start < days[r.s], ca: r.t.end > days[r.e] });
  }
  return { bars, lanes: ends.length };
}

// ---------- drawing bits ----------
function tally(n) { return `<span class="count">${n}</span>`; }
const ICON = {
  cal: '<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  person: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>', flag: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
  video: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>', pin: '<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  bldg: '<path d="M4 21V5h10v16M14 9h6v12M7 9h4M7 13h4M7 17h4"/>', brief: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/>',
  hash: '<path d="M5 9h15M4 15h15M10 3 8 21M16 3l-2 18"/>', check: '<path d="M4 12l5 5L20 6"/>', board: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/>',
  contact: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M14 10h4M14 14h4M5.5 16c.7-1.7 2-2.5 3.5-2.5s2.8.8 3.5 2.5"/>',
};
const svg = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
function row(icon, label, value, extra) {
  return `<div class="row"><div class="lbl">${esc(label)}</div><div class="val">${esc(value)}</div>${extra ? `<div class="val2">${esc(extra)}</div>` : ""}</div>`;
}

function card(t, day, compact) {
  const key = (day || "") + "|" + t.id, open = S.open.has(key);
  const c = tColor(t), sc = chalkColor(t.sHex, t.status);
  const time = t.st && t.et ? `${clock(t.st)} – ${clock(t.et)}${t.tz ? " " + t.tz : ""}` : "All day";
  return `<article class="card ${open ? "open" : ""} ${isX(t) ? "x" : ""}" style="--c:${c};--sc:${sc}" data-card="${esc(key)}" tabindex="0" role="button" aria-expanded="${open}">
    <div class="chead"><span class="stripe"></span>
      <div class="cbody">
        <div class="ctitle chalk" style="${compact ? "font-size:16px" : ""}">${esc(course(t))}</div>
        ${t.segment ? `<div class="cseg">${esc(t.segment)}</div>` : ""}
        <div class="cwho">${esc(t.instructor || "Unassigned")}</div>
        <div class="cmeta">${esc(time)}</div>
        ${!compact && rest(t) ? `<div class="cmeta">${esc(rest(t))}</div>` : ""}
      </div>
      <div class="cside">${!compact && t.status ? `<span class="pill2">${esc(t.status)}</span>` : ""}<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>
    </div>
    <div class="more"><div>${open ? details(t, day) : ""}</div></div>
  </article>`;
}
function details(t, day) {
  const ss = sessions(t), idx = day ? ss.indexOf(day) : -1;
  let html = '<div class="details">';
  if (idx >= 0) {
    html += `<div class="prog"><span>Day ${idx + 1} of ${ss.length}</span>` + (ss.length <= 30
      ? `<div class="dots">${ss.map((_, i) => `<i class="${i < idx ? "done" : i === idx ? "now" : ""}" style="animation-delay:${i * 25}ms"></i>`).join("")}</div>`
      : `<div class="track"><span style="width:${((idx + 1) / ss.length * 100).toFixed(1)}%"></span></div>`) + "</div>";
  }
  const range = t.start === t.end ? D.fmt(t.start, { weekday: "short", month: "short", day: "numeric", year: "numeric" })
    : `${D.fmt(t.start, { weekday: "short", month: "short", day: "numeric" })} – ${D.fmt(t.end, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}`;
  html += '<div class="grid2">';
  html += row("cal", "Dates", range, ss.length > 1 ? `${ss.length} sessions` : "");
  if (t.st && t.et) {
    let local = "";
    const iv = day && interval(t, day);
    if (iv && t.tzId && tzOffsetMs(iv[0], t.tzId) !== -new Date(iv[0]).getTimezoneOffset() * 6e4) {
      const f = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      const ld = new Date(iv[0]); const lk = `${ld.getFullYear()}-${pad(ld.getMonth() + 1)}-${pad(ld.getDate())}`;
      local = `${f(iv[0])} – ${f(iv[1])}${lk !== day ? " (" + D.fmt(lk, { weekday: "short" }) + ")" : ""} your time`;
    }
    html += row("clock", "Class time", `${clock(t.st)} – ${clock(t.et)}${t.tz ? " " + t.tz : ""}`, local);
  }
  html += row("person", "Instructor", t.instructor || "Unassigned");
  if (t.status) html += row("flag", "Status", t.status);
  if (t.delivery) html += row("video", "Delivery", t.delivery);
  if (t.location) html += row("pin", "Location", t.location);
  if (t.customer) html += row("bldg", "Customer", t.customer);
  if (t.client) html += row("brief", "Client", t.client);
  if (t.contact) html += row("contact", "Client contact", t.contact);
  if (t.opp) html += row("hash", "Opportunity", t.opp);
  html += row("check", "Confirmed", t.confirmed ? "Yes" : "Not yet");
  html += row("board", "Board", t.group ? `${t.boardTitle} · ${t.group}` : t.boardTitle);
  html += "</div>";
  html += `<div class="actions"><a class="p" href="https://innovativeio-company.monday.com/boards/${BOARDS.find((b) => b.key === t.board).id}/pulses/${esc(t.itemID)}" target="_blank" rel="noopener">Open in monday</a>`;
  if (t.location) html += `<a href="https://maps.apple.com/?q=${encodeURIComponent(t.location)}" target="_blank" rel="noopener">Map</a>`;
  return html + "</div></div>";
}

function weekRow(days, month, list, rowIdx, zoomable) {
  const n = days.length, lay = layout(days, list), today = D.today();
  const h = Math.max(64, 27 + lay.lanes * 24 + 6);
  let cells = "";
  days.forEach((d, i) => {
    const count = lay.bars.filter((b) => b.s <= i && b.e >= i).length;
    const cls = ["cell", D.wkend(d) && "wkend", month && d.slice(0, 7) !== month && "out", d === today && "today", wide() && S.sel === d && "sel"].filter(Boolean).join(" ");
    cells += `<button class="${cls}" data-day="${d}" aria-label="${esc(D.fmt(d, { weekday: "long", month: "long", day: "numeric" }))}, ${count} classes"><span class="num">${Number(d.slice(8))}</span>${count ? tally(count) : ""}</button>`;
  });
  let bars = "";
  for (const b of lay.bars) {
    const t = b.t, pct = 100 / n, span = b.e - b.s + 1;
    const cls = ["bar", b.cb && "cb", b.ca && "ca", /scheduling/i.test(t.status) && "dash", isX(t) && "x"].filter(Boolean).join(" ");
    bars += `<button class="${cls}" style="--c:${tColor(t)};left:calc(${b.s * pct}% + 2px);width:calc(${span * pct}% - 4px);top:${27 + b.lane * 24}px;animation-delay:${(rowIdx * 50 + b.s * 35 + b.lane * 20)}ms" data-bar="${esc(t.id)}" data-s="${b.s}" data-span="${span}" data-days="${days.slice(b.s, b.e + 1).join(",")}" aria-label="${esc(title(t))}, ${esc(t.instructor)}">${b.cb ? "‹" : ""}${span > 1 && realPerson(t) ? `<span class="ini">${esc(initials(t))}</span>` : ""}<span class="t">${esc(title(t))}</span>${b.ca ? "›" : ""}</button>`;
  }
  return `<div class="week" style="height:${h}px"><div class="cells" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${cells}</div>${bars}</div>`;
}
function dow(days) {
  return `<div class="dow" style="grid-template-columns:repeat(${days.length},minmax(0,1fr))">${days.map((d) => `<span>${D.fmt(d, { weekday: "short" })}</span>`).join("")}</div>`;
}

// ---------- render ----------
function renderHeader(list) {
  let t, s, days;
  if (S.mode === "month") {
    t = D.fmt(S.anchor, { month: "long" });
    days = D.monthWeeks(S.anchor).flat().filter((d) => d.slice(0, 7) === S.anchor.slice(0, 7));
    s = D.fmt(S.anchor, { year: "numeric" });
  } else {
    days = D.week(S.anchor);
    const a = days[0], b = days[6];
    t = a.slice(0, 7) === b.slice(0, 7) ? `${D.fmt(a, { month: "short", day: "numeric" })}–${Number(b.slice(8))}` : `${D.fmt(a, { month: "short", day: "numeric" })} – ${D.fmt(b, { month: "short", day: "numeric" })}`;
    s = D.fmt(b, { year: "numeric" });
  }
  const n = list.filter((x) => x.end >= days[0] && x.start <= days[days.length - 1]).length;
  const th = `${esc(t)} <em>${esc(s)}</em>`;
  if ($("title").innerHTML !== th) $("title").innerHTML = th;
  $("sub").textContent = S.all.length ? `${n} ${n === 1 ? "class" : "classes"} this ${S.mode}` : (S.loading ? "Reading your monday boards" : "");
  $("mWeek").setAttribute("aria-pressed", S.mode === "week"); $("mMonth").setAttribute("aria-pressed", S.mode === "month");
  const on = S.mode === "week" ? $("mWeek") : $("mMonth"), pill = $("pill");
  pill.style.left = on.offsetLeft + "px"; pill.style.width = on.offsetWidth + "px";
  $("filterBtn").classList.toggle("on", !!(S.who || S.search));
  $("refresh").classList.toggle("spin", S.loading);
}
function renderBanner() {
  let html = "";
  if (S.error) {
    html = `<div class="banner warn"><p>${esc(S.error.text)}</p>${S.error.action ? `<button class="btn" id="errAct">${esc(S.error.action)}</button>` : ""}</div>`;
  } else if (!S.all.length && S.loading) {
    html = `<div class="banner info"><p>Reading the Trainings, Bootcamps and Completed Courses boards from monday…</p></div>`;
  }
  $("banner").innerHTML = html;
  const b = $("errAct"); if (b) b.onclick = () => sync(true);
}
function renderBoard(list) {
  const board = $("board");
  let html = "";
  if (S.mode === "month") {
    const weeks = D.monthWeeks(S.anchor), month = S.anchor.slice(0, 7);
    html += dow(cols(weeks[0]));
    weeks.forEach((w, i) => { html += weekRow(cols(w), month, list, i, true); });
  } else {
    const days = cols(D.week(S.anchor));
    html += dow(days) + weekRow(days, null, list, 0, false);
    const colsMode = board.clientWidth >= 640;
    html += `<div class="days ${colsMode ? "cols" : ""}">` + days.map((d) => {
      const items = onDay(list, d);
      return `<section><button class="dayhead ${d === D.today() ? "today" : ""}" data-day="${d}"><span class="dn">${D.fmt(d, { weekday: colsMode ? "short" : "long" })}</span><span class="dd">${D.fmt(d, { month: "short", day: "numeric" })}</span>${!colsMode && items.length ? tally(items.length) : ""}</button>
        <div class="stack">${items.length ? items.map((t) => card(t, d, colsMode)).join("") : `<div class="none">No classes</div>`}</div></section>`;
    }).join("") + "</div>";
  }
  board.innerHTML = html;
  if (S.dir) { board.classList.remove("page-in-next", "page-in-prev"); void board.offsetWidth; board.classList.add(S.dir > 0 ? "page-in-next" : "page-in-prev"); S.dir = 0; }
}
function dayHTML(list) {
  const d = S.sel, items = onDay(list, d), isToday = d === D.today();
  let ruler = "";
  const timed = items.map((t) => [t, interval(t, d)]).filter((x) => x[1]);
  if (timed.length) {
    const [y, m, dd] = d.split("-").map(Number), mid = new Date(y, m - 1, dd).getTime();
    const hrs = timed.map(([t, iv]) => [t, (iv[0] - mid) / 36e5, (iv[1] - mid) / 36e5]);
    const lo = Math.max(-12, Math.floor(Math.min(7, ...hrs.map((x) => x[1])))), hi = Math.min(36, Math.ceil(Math.max(19, ...hrs.map((x) => x[2]))));
    const W = 600, sc = W / (hi - lo), step = hi - lo > 16 ? 3 : 2, H = 22 + hrs.length * 12;
    let g = "";
    for (let h = lo; h <= hi; h += step) { const x = (h - lo) * sc, hh = ((h % 24) + 24) % 24; g += `<line x1="${x}" y1="0" x2="${x}" y2="${H}"/><text x="${x + 3}" y="10" font-size="11">${hh % 12 || 12}${hh < 12 ? "a" : "p"}</text>`; }
    hrs.forEach(([t, a, b], i) => { g += `<rect x="${(a - lo) * sc}" y="${18 + i * 12}" width="${Math.max(6, (b - a) * sc)}" height="6" rx="3" fill="${tColor(t)}"><title>${esc(title(t))}</title></rect>`; });
    if (isToday) { const now = (Date.now() - mid) / 36e5; if (now >= lo && now <= hi) g += `<rect x="${(now - lo) * sc - 1}" y="12" width="2" height="${H - 12}" fill="#ef4444"/>`; }
    ruler = `<div class="ruler"><div class="lbl">Your time</div><svg viewBox="0 0 ${W} ${H}" height="${H}" preserveAspectRatio="none" role="img" aria-label="Class times today">${g}</svg></div>`;
  }
  return `<div class="dayview">
    <div class="dvtop">
      ${!wide() ? `<button class="icon" data-close aria-label="Back to calendar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>` : ""}
      <div class="t"><div class="dvname ${isToday ? "today" : ""}">${isToday ? "Today" : D.fmt(d, { weekday: "long" })}</div><div class="dvdate">${D.fmt(d, { month: "long", day: "numeric", year: "numeric" })}</div></div>
      <button class="icon" data-step="-1" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="icon" data-step="1" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="dvcount">${items.length ? `${items.length} ${items.length === 1 ? "class" : "classes"}` : "Nothing scheduled"}</div>
    ${ruler}
    ${items.length ? `<div class="stack">${items.map((t) => card(t, d, false)).join("")}</div>` : `<div class="empty"><svg viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg>${D.wkend(d) ? "It's the weekend" : "No classes scheduled"}</div>`}
  </div>`;
}
function renderDay(list) {
  const target = wide() ? $("pane") : $("zoom");
  if (!wide() && $("zoom").hidden) return;
  target.innerHTML = dayHTML(list);
  if (S.focus) {
    const el = target.querySelector(`[data-card="${CSS.escape(S.sel + "|" + S.focus)}"]`);
    S.focus = null;
    if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 380);
  }
}
function render() {
  const list = visible();
  renderHeader(list); renderBanner(); renderBoard(list);
  if (wide()) renderDay(list); else if (!$("zoom").hidden) renderDay(list);
}

// ---------- interactions ----------
function page(n) {
  S.dir = n;
  S.anchor = S.mode === "month" ? D.addMonths(S.anchor, n) : D.add(S.anchor, 7 * n);
  render();
}
function openDay(day, focus, originEl) {
  S.sel = day; S.focus = focus || null;
  if (focus) S.open.add(day + "|" + focus);
  if (wide()) { render(); return; }
  const z = $("zoom");
  if (originEl) { const r = originEl.getBoundingClientRect(); z.style.setProperty("--ox", r.left + r.width / 2 + "px"); z.style.setProperty("--oy", r.top + r.height / 2 + "px"); }
  z.hidden = false; z.scrollTop = 0;
  renderDay(visible());
  requestAnimationFrame(() => requestAnimationFrame(() => z.classList.remove("closed")));
}
function closeDay() {
  const z = $("zoom"); z.classList.add("closed");
  setTimeout(() => { z.hidden = true; z.innerHTML = ""; }, 420);
}
function stepDay(n) {
  let d = D.add(S.sel, n);
  if (!S.wkends) while (D.wkend(d)) d = D.add(d, n > 0 ? 1 : -1);
  S.sel = d; render();
  const t = wide() ? $("pane") : $("zoom");
  t.scrollTop = 0;
  const v = t.querySelector(".dayview"); if (v) v.classList.add(n > 0 ? "page-in-next" : "page-in-prev");
}
function toggleCard(el) {
  const key = el.dataset.card, [day, ...rest2] = key.split("|"), id = rest2.join("|");
  const t = S.all.find((x) => x.id === id); if (!t) return;
  const opening = !S.open.has(key);
  if (opening) S.open.add(key); else S.open.delete(key);
  el.classList.toggle("open", opening); el.setAttribute("aria-expanded", opening);
  const inner = el.querySelector(".more > div");
  if (opening) inner.innerHTML = details(t, day || null);
  else setTimeout(() => { if (!S.open.has(key)) inner.innerHTML = ""; }, 400);
  if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
}
function onClick(e) {
  if (e.target.closest("a")) return;
  const card = e.target.closest("[data-card]"); if (card) { toggleCard(card); return; }
  const bar = e.target.closest("[data-bar]");
  if (bar) {
    const r = bar.getBoundingClientRect(), span = Number(bar.dataset.span), days = bar.dataset.days.split(",");
    const i = Math.max(0, Math.min(span - 1, Math.floor((e.clientX - r.left) / (r.width / span))));
    openDay(days[i] || days[0], bar.dataset.bar, bar); return;
  }
  const day = e.target.closest("[data-day]"); if (day) { openDay(day.dataset.day, null, day); return; }
  if (e.target.closest("[data-close]")) { closeDay(); return; }
  const st = e.target.closest("[data-step]"); if (st) stepDay(Number(st.dataset.step));
}
document.addEventListener("click", onClick);
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-card]")) { e.preventDefault(); toggleCard(e.target); }
  if (e.key === "Escape") { if (!$("zoom").hidden) closeDay(); closeSheet(); }
});
function swipe(el, fn) {
  let x0 = 0, y0 = 0, on = false;
  el.addEventListener("touchstart", (e) => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; on = true; }, { passive: true });
  el.addEventListener("touchend", (e) => {
    if (!on) return; on = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) fn(dx < 0 ? 1 : -1);
  }, { passive: true });
}
swipe($("board"), page);
swipe($("zoom"), stepDay);
swipe($("pane"), stepDay);

$("prev").onclick = () => page(-1);
$("next").onclick = () => page(1);
$("todayBtn").onclick = () => { const t = D.today(); S.dir = t >= S.anchor ? 1 : -1; S.anchor = t; S.sel = t; render(); };
$("mWeek").onclick = () => { S.mode = "week"; store.set("mode", "week"); render(); };
$("mMonth").onclick = () => { S.mode = "month"; store.set("mode", "month"); render(); };
$("refresh").onclick = () => sync(true);

// Filter sheet
function renderWho() {
  const counts = {}; for (const t of S.all) if (realPerson(t)) counts[t.instructor] = (counts[t.instructor] || 0) + 1;
  const hex = {}; for (const t of S.all) if (realPerson(t) && !hex[t.instructor]) hex[t.instructor] = t.iHex;
  const mine = S.all.filter((t) => t.instructor.toLowerCase() === S.myName.toLowerCase()).length;
  const btn = (val, name, c, k) => `<button data-who="${esc(val)}" aria-pressed="${S.who === val}" style="--c:${c}"><span class="dot"></span><span class="n">${esc(name)}</span><span class="k">${k}</span></button>`;
  $("who").innerHTML = btn("", "Everyone", "var(--muted)", S.all.length) + btn("__me__", `Just me (${S.myName || "set your name"})`, "var(--accent)", mine)
    + Object.keys(counts).sort().map((n) => btn(n, n, chalkColor(hex[n], n), counts[n])).join("");
}
function renderThemes() {
  $("themes").innerHTML = SKINS.map((k) => `<button data-skin="${k.id}" aria-pressed="${S.skin === k.id}"><span class="sw" style="background:${k.bg}"><b style="background:${k.acc}"></b><i style="background:${k.bars[0]};width:90%"></i><i style="background:${k.bars[1]};width:60%"></i></span>${k.name}</button>`).join("");
}
$("themes").onclick = (e) => { const b = e.target.closest("[data-skin]"); if (!b) return; S.skin = b.dataset.skin; store.set("skin", S.skin); applySkin(); renderThemes(); render(); };
function openSheet() { renderThemes(); renderWho(); $("scrim").classList.remove("closed"); $("sheet").classList.remove("closed"); }
function closeSheet() { $("scrim").classList.add("closed"); $("sheet").classList.add("closed"); }
$("filterBtn").onclick = openSheet; $("sheetDone").onclick = closeSheet; $("scrim").onclick = closeSheet;
$("who").onclick = (e) => { const b = e.target.closest("[data-who]"); if (!b) return; S.who = b.dataset.who; store.set("who", S.who); renderWho(); render(); };
$("search").oninput = (e) => { S.search = e.target.value; render(); };
$("myName").value = S.myName;
$("myName").oninput = (e) => { S.myName = e.target.value; store.set("myName", S.myName); renderWho(); render(); };
for (const [id, k] of [["hideX", "hideX"], ["incDone", "incDone"], ["wkends", "wkends"]]) {
  $(id).checked = S[k];
  $(id).onchange = (e) => { S[k] = e.target.checked; store.set(k, S[k]); render(); };
}
let wasWide = wide();
addEventListener("resize", () => {
  const w = wide();
  if (w !== wasWide) { wasWide = w; if (w && !$("zoom").hidden) { $("zoom").hidden = true; $("zoom").classList.add("closed"); } }
  render();
});

// ---------- monday sync through the viewer's connector ----------
let mcp = null;
const mcpReady = (window.claude && window.claude.use) ? window.claude.use("mcp").then((m) => (mcp = m)).catch(() => null) : Promise.resolve(null);

async function ask(query, variables, fresh) {
  const res = await mcp.callTool(SERVER, TOOL, { query, variables: JSON.stringify(variables) }, { cache: { staleTime: fresh ? 0 : 5 * 6e4, gcTime: 7 * 864e5, refresh: !!fresh } });
  let p = res.payload;
  if (typeof p === "string") { try { p = JSON.parse(p); } catch { throw { code: "tool_error", message: p }; } }
  if (p && p.data && !p.boards && !p.next_items_page) p = p.data;
  return p || {};
}
async function readBoard(b, fresh) {
  const items = [];
  let page = (await ask(Q_FIRST(b.subitems), { b: b.id }, fresh))?.boards?.[0]?.items_page;
  if (!page) throw { code: "tool_error", message: `Board ${b.title} returned no data.` };
  items.push(...page.items);
  let guard = 0;
  while (page.cursor && guard++ < 50) {
    page = (await ask(Q_NEXT(b.subitems), { c: page.cursor }, fresh))?.next_items_page;
    if (!page) break;
    items.push(...page.items);
  }
  return items.flatMap((it) => toTrainings(it, b));
}
function explain(err) {
  switch (err && err.code) {
    case "needs_reauth": return { text: "Your monday.com connection has expired. Reconnect monday.com in claude.ai Settings → Connectors, then sync again.", action: "Sync" };
    case "server_not_connected": case "server_not_found": return { text: "monday.com isn't connected for your account. Add it in claude.ai Settings → Connectors, then sync again.", action: "Sync" };
    case "selection_required": return { text: "You have more than one monday.com connection. Choose one in the prompt claude.ai shows, then sync.", action: "Sync" };
    case "not_in_manifest": case "approval_required": case "consent_required": return { text: "This page needs your OK to read your monday boards.", action: "Allow and sync" };
    case "blocked_by_policy": return { text: "Your organization's policy blocks reading monday from this page." };
    case "server_unavailable": return { text: "monday.com didn't answer just now. Showing your last sync.", action: "Try again" };
    case "tool_error": return { text: "monday returned an error: " + String(err.message || "").slice(0, 200), action: "Try again" };
    case "not_granted": case "capability_disabled": case "capability_removed": return { text: "Live sync works when this page is open in claude.ai or the Claude app." };
    default: return { text: "Couldn't sync with monday" + (err && err.message ? ": " + String(err.message).slice(0, 160) : "."), action: "Try again" };
  }
}
async function sync(fresh) {
  if (S.loading) return;
  await mcpReady;
  if (!mcp) {
    S.error = { text: S.all.length ? "Showing your last sync. Live sync works when this page is open in claude.ai or the Claude app." : "Open this page in claude.ai or the Claude app to load your monday boards." };
    render(); return;
  }
  S.loading = true; S.error = null; render();
  try {
    let all;
    try { all = (await Promise.all(BOARDS.map((b) => readBoard(b, fresh)))).flat(); }
    catch (e) {
      if (e && e.retryable) { await new Promise((r) => setTimeout(r, (e.retryAfterMs || 1200) + Math.random() * 800)); all = (await Promise.all(BOARDS.map((b) => readBoard(b, fresh)))).flat(); }
      else throw e;
    }
    const seen = new Set();
    S.all = all.filter((t) => !seen.has(t.id) && seen.add(t.id)).sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0) || title(a).localeCompare(title(b)));
    S.syncedAt = Date.now();
    store.set("cache", S.all); store.set("syncedAt", S.syncedAt);
  } catch (e) {
    S.error = explain(e);
    if (e && ["needs_reauth", "server_not_connected", "blocked_by_policy"].includes(e.code)) { S.all = []; store.set("cache", []); }
  } finally {
    S.loading = false; render();
  }
}

render();
sync(false);
document.addEventListener("visibilitychange", () => { if (!document.hidden && (!S.syncedAt || Date.now() - S.syncedAt > 5 * 6e4)) sync(false); });
})();
